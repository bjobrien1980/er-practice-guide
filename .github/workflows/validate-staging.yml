name: Validate ER Practice Guide

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source and citation validation
        run: |
          npm run verify
          npm run linkcheck

      - name: Build the static site
        # The full local registry step reads private Briefer snapshots that are
        # intentionally not copied into GitHub. CI validates the committed
        # registry, pinpoints and static build instead.
        run: npx astro build
