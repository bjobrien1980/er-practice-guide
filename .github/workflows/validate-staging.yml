name: Validate ER Practice Guide

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository link validation
        # The local verify/registry scripts read private Briefer snapshots that
        # are intentionally not copied into GitHub. Local MS64 validation runs
        # those additional source-aware gates before pushing to staging.
        run: npm run linkcheck

      - name: Build the static site
        run: npx astro build

      - name: Check rendered routes and content
        run: npm run contentcheck
